name: CD - Algorithm

on:
  push:
    branches: [main]

jobs:
  sync-library:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout s.o.s
        uses: actions/checkout@v5
        with:
          path: s.o.s

      - name: Checkout libutils
        uses: actions/checkout@v5
        with:
          repository: TsukiNi22/libutils
          token: ${{ secrets.LIBRARY_REPO_TOKEN }}
          path: y_lib_cpp

      - name: Sync files into library
        run: |
          set -e

          # Change namespace and macro usages
          find s.o.s/include/sos/ -type f \( -name "*" \) \
            -exec sed -i \
            -e 's/\bsos::/utils::algorithms::sos::/g' \
            {} +
          find s.o.s/include/sos/ -type f \( -name "*" \) \
            -exec sed -i \
            -e 's/namespace sos/namespace utils::algorithms::sos/' \
            -e '/#include "\.\.\/sosDefine\.hpp"/i #include "utils/attribute/Attribute.hpp"' \
            -e '/#include "algorithm\/embed_optimized\.hpp"/i #include "utils/attribute/Attribute.hpp"' \
            -e 's/\[\[unlikely\]\]/_unlikely/g' \
            -e 's/\[\[likely\]\]/_likely/g' \
            -e 's/\[\[nodiscard\]\]/_nodiscard/g' \
            -e 's/\[\[maybe_unused\]\]/_unused/g' \
            {} +

          # Move files
          sudo apt-get update
          sudo apt-get install tree
          tree
          rm -rf libutils/include/utils/algorithms/sos
          cp -r s.o.s/include/sos libutils/include/utils/algorithms/sos

      - name: Commit and push
        working-directory: libutils
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add include/utils/algorithms/
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync algorithm from s.o.s (${{ github.sha }})"
          git push origin main
